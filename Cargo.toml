[package]
name = "waybot"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.3"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
